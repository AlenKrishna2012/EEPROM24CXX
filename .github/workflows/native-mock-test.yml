name: Native mock tests
on:
  push:
    branches: [test/native-simulation-1.0.8]
  pull_request:
    branches: [test/native-simulation-1.0.8]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run mock tests
        run: |
          g++ -std=c++17 -Itests/native/mock tests/native/test.cpp src/EEPROM24CXX.cpp -o eeprom-test
          ./eeprom-test

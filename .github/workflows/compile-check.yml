name: Compile Check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Arduino examples
        uses: arduino/compile-sketches@v1
        with:
          sketch-paths: |
            examples
          libraries: |
            - source-path: ./
